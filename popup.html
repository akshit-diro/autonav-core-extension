<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Nav Tools</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 12px;
      color: #1a1a1a;
      text-align: center;
    }

    .status {
      padding: 8px 12px;
      background: #e8f5e9;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 12px;
      word-break: break-all;
    }

    .status.error {
      background: #ffebee;
      color: #c62828;
    }

    .status.success {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .status.info {
      background: #e3f2fd;
      color: #1565c0;
    }

    button {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 6px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    button:disabled {
      background: #bdbdbd !important;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-dom { background: #1976d2; color: white; }
    .btn-screenshot { background: #388e3c; color: white; }
    .btn-message { background: #7b1fa2; color: white; }
    .btn-get { background: #f57c00; color: white; }
    .btn-post { background: #d32f2f; color: white; }
    .btn-load { background: #00796b; color: white; }

    .config-section {
      margin-top: 12px;
      padding: 12px;
      background: white;
      border-radius: 6px;
    }

    .config-section h2 {
      font-size: 14px;
      margin-bottom: 8px;
      color: #555;
    }

    label {
      display: block;
      font-size: 11px;
      margin-bottom: 4px;
      color: #666;
    }

    input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      margin-bottom: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
    }

    .log-area {
      margin-top: 12px;
      padding: 8px;
      background: #263238;
      color: #aed581;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      max-height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>Auto Nav Tools</h1>

  <div id="status" class="status info">Ready</div>

  <button id="domBtn" class="btn-dom">1. Extract Interactive DOM Elements</button>
  <button id="screenshotBtn" class="btn-screenshot">2. Take Screenshot</button>
  <button id="messageBtn" class="btn-message">3. Send Content → Background Message</button>
  <button id="getBtn" class="btn-get">4. Make GET Request</button>
  <button id="postBtn" class="btn-post">5. Make POST Request</button>
  <button id="loadPopupBtn" class="btn-load">6. Load Popup</button>

  <div class="config-section">
    <h2>API Config</h2>
    <label for="apiUrl">API URL</label>
    <input type="text" id="apiUrl" placeholder="https://httpbin.org/get">
    <button id="saveBtn" style="background:#555;color:white;">Save Config</button>
  </div>

  <div id="logArea" class="log-area">Waiting for actions...</div>

  <script src="popup.js"></script>
</body>
</html>
