<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 280px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    p {
      font-size: 14px;
      opacity: 0.9;
    }

    #clickCount {
      margin-top: 16px;
      font-size: 16px;
      font-weight: bold;
    }

    button {
      margin-top: 12px;
      padding: 8px 20px;
      border: 2px solid white;
      border-radius: 6px;
      background: transparent;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background: white;
      color: #764ba2;
    }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>
  <p>Chrome Extension</p>
  <div id="clickCount">Clicks: 0</div>
  <button id="greetBtn">Click Me</button>

  <script src="popup.js"></script>
</body>
</html>
